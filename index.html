  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

iv style=\"font-size:12.5px;color:#b9d6df\">سازمان منطقه ویژه اقتصادی انرژی پارس<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;max-width:560px\">\n        <div style=\"border-right:3px solid #7fb9c9;padding-right:10px;font-size:13.5px;color:#cfe4ea\">ارزیابی مبتنی بر شواهد<\u002Fdiv>\n        <div style=\"font-size:clamp(30px,3.6vw,46px);font-weight:700;line-height:1.5;text-wrap:pretty\">تصویری روشن از آمادگی زیرساخت های منطقه ویژه اقتصادی<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:2;color:#d6e7ec;text-wrap:pretty\">از ثبت مستندات تا ارزیابی تخصصی و شناسایی فرصت‌های بهبود، در یک مسیر یکپارچه؛ ویژه‌ی واحدهای پتروشیمی، نفت و گاز منطقه‌ی پارس جنوبی.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid rgba(255,255,255,.18);padding-top:22px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px\">\n        <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"font-size:13px;color:#8fc0cd\">۰۱<\u002Fdiv><div style=\"font-size:14px\">ثبت و مستندسازی<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"font-size:13px;color:#8fc0cd\">۰۲<\u002Fdiv><div style=\"font-size:14px\">بررسی و ارزیابی<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"font-size:13px;color:#8fc0cd\">۰۳<\u002Fdiv><div style=\"font-size:14px\">تحلیل و بهبود<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 420px;display:flex;align-items:center;justify-content:center;padding:clamp(24px,5vw,64px)\">\n      <div style=\"width:100%;max-width:400px;display:flex;flex-direction:column;gap:20px\">\n        <div style=\"align-self:flex-start;font-size:12px;color:#155e75;background:#eaf7fa;border:1px solid #cde9f0;border-radius:6px;padding:4px 10px\">دوره ۱۴۰۵<\u002Fdiv>\n        <div style=\"display:flex;flex-direction n              <div style=\"width:280px;flex:none;position:sticky;top:20px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 40px);overflow-y:auto\">\n                <div style=\"font-size:12px;color:#9ca3af;padding:6px 10px 8px\">شاخص‌های اصلی<\u002Fdiv>\n                <sc-for list=\"{{ qv.inds }}\" as=\"ni\" hint-placeholder-count=\"13\">\n                  <button sc-camel-on-click=\"{{ ni.onClick }}\" style=\"display:flex;flex-direction:column;gap:6px;padding:10px;border:none;border-radius:8px;background:{{ ni.bg }};cursor:pointer;text-align:right\" style-hover=\"background:#f3f7f9\">\n                    <span style=\"display:flex;gap:8px;align-items:baseline;width:100%\"><span style=\"font-size:12px;color:#9ca3af;width:18px;flex:none\">{{ ni.num }}<\u002Fspan><span style=\"flex:1;font-size:13.5px;color:{{ ni.fg }};font-weight:{{ ni.fw }};line-height:1.6\">{{ ni.name }}<\u002Fspan><\u002Fspan>\n                    <span style=\"display:flex;align-items:center;gap:8px;padding-right:26px;width:100%\"><span style=\"flex:1;height:4px;background:#e5e7eb;border-radius:3px;overflow:hidden;display:block\"><span style=\"display:block;height:100%;width:{{ ni.w }};background:{{ ni.barColor }}\"><\u002Fspan><\u002Fspan><span style=\"font-size:11.5px;color:#6b7280\">{{ ni.count }}<\u002Fspan><\u002Fspan>\n                    <sc-if value=\"{{ ni.hasPreview }}\"><span style=\"font-size:11.5px;color:#155e75;padding-right:26px\">{{ ni.preview }}<\u002Fspan><\u002Fsc-if>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:14px\">\n              <sc-if value=\"{{ narrow }}\">\n                <sc-raw-select value=\"{{ qv.indId }}\" sc-camel-on-change=\"{{ qv.onIndSelect }}\" style=\"height:44px;border:1px solid #d1d5db;border-radius:10px;padding:0 12px;font-size:14px;background:#fff\">\n                  <sc-for list=\"{{ qv.inds }}\" as=\"o\"><option value=\"{{ o.id }}\">{{ o.num }}. {{ o.name }} ({{ o.count }})<\u002Foption><\u002Fsc-for>\n                <\u002Fsc-raw-select>\n              <\u002Fsc-if>\n              <div style=\"display:flex;flex-direction:column;gap:4px\">\n                <div style=\"font-size:18px;font-weight:700\">{{ qv.indName }}<\u002Fdiv>\n                <div style=\"font-size:13px;color:#6b7280\">{{ qv.indMeta }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center\">\n                <sc-for list=\"{{ qv.filters }}\" as=\"f\" hint-placeholder-count=\"5\">\n                  <button sc-camel-on-click=\"{{ f.onClick }}\" style=\"height:34px;padding:0 14px;border-radius:999px;border:1px solid {{ f.bd }};background:{{ f.bg }};color:{{ f.fg }};font-size:13px;cursor:pointer\">{{ f.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n                <div style=\"flex:1 1 200px;display:flex;align-items:center;gap:8px;height:36px;border:1px solid #d1d5db;border-radius:10px;padding:0 12px;background:#fff\">\n                  <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#9ca3af\" stroke-width=\"2\"><circle cx=\"11\" cy=\"11\" r=\"8\"><\u002Fcircle><path d=\"m21 21-4.3-4.3\"><\u002Fpath><\u002Fsvg>\n                  <input value=\"{{ qv.search }}\" sc-camel-on-change=\"{{ qv.onSearch }}\" placeholder=\"جست‌وجو در متن بندها\" style=\"border:none;outline:none;flex:1;font-size:13.5px;min-width:0;background:transparent\">\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ qv.empty }}\"><div style=\"background:#fff;border:1px dashed #d1d5db;border-radius:12px;padding:32px;text-align:center;color:#6b7280;font-size:14px\">بندی با این فیلتر در این شاخص وجود ندارد.<\u002Fdiv><\u002Fsc-if>\n              <sc-for list=\"{{ qv.subs }}\" as=\"sb\" hint-placeholder-count=\"3\">\n                <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,.06);overflow:hidden\">\n                  <button sc-camel-on-click=\"{{ sb.toggle }}\" style=\"width:100%;display:flex;align-items:center;gap:12px;padding:14px 18px;border:none;background:#fbfcfd;cursor:pointer;text-align:right\">\n                    <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#6b7280\" stroke-width=\"2\" style=\"transform:{{ sb.rot }};transition:transform .15s\"><path d=\"m6 9 6 6 6-6\"><\u002Fpath><\u002Fsvg>\n                    <span style=\"flex:1;font-size:14.5px;font-weight:600;color:#1f2937\">{{ sb.name }}<\u002Fspan>\n                    <span style=\"font-size:12px;color:#6b7280;background:#f3f4f6;border-radius:999px;padding:2px 10px\">{{ sb.counter }}<\u002Fspan>\n                  <\u002Fbutton>\n                  <sc-if value=\"{{ sb.open }}\">\n                    <sc-for list=\"{{ sb.qs }}\" as=\"q\" hint-placeholder-count=\"4\">\n                      <div id=\"{{ q.anchor }}\" style=\"padding:16px 18px;border-top:1px solid #eef0f2;display:flex;flex-direction:column;gap:12px\">\n                        <div style=\"display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap\">\n                          <div style=\"flex:none;min-width:32px;height:26px;border-radius:6px;background:#f3f4f6;color:#4b5563;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 6px\">{{ q.num }}<\u002Fdiv>\n                          <div style=\"flex:1 1 260px;min-width:0;font-size:14.5px;line-height:1.95;text-wrap:pretty\">{{ q.text }}<\u002Fdiv>\n                          <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n                            <span style=\"font-size:11.5px;border-radius:6px;padding:2px 8px;background:{{ q.pBg }};color:{{ q.pFg }};border:1px solid {{ q.pBd }}\">{{ q.prio }}<\u002Fspan>\n                            <span style=\"font-size:11.5px;border-radius:6px;padding:2px 8px;background:{{ q.sBg }};color:{{ q.sFg }}\">{{ q.sLabel }}<\u002Fspan>\n                          <\u002Fdiv>\n                        <\u002Fdiv>\n                        <div style=\"display:flex;flex-direction:column;gap:12px;padding-right:44px\">\n                          <sc-if value=\"{{ q.edit }}\">\n                            <div style=\"display:flex;flex-direction:column;gap:6px\">\n                              <label style=\"font-size:12.5px;color:#374151;font-weight:600\">پاسخ تشریحی <span style=\"color:#b91c1c\">*<\u002Fspan><\u002Flabel>\n                              <textarea value=\"{{ q.cmt }}\" sc-camel-on-change=\"{{ q.onCmt }}\" sc-camel-max-length=\"4000\" rows=\"4\" placeholder=\"شرح دهید این بند در سازمان شما چگونه اجرا می‌شود: مسئول، روش اجرا، سوابق و مستندات مرتبط.\" style=\"border:1px solid {{ q.taBd }};border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.9;resize:vertical;outline-color:#155e75\"><\u002Ftextarea>\n                              <div style=\"display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:{{ q.hintFg }}\"><span>{{ q.hint }}<\u002Fspan><span style=\"color:#9ca3af\">{{ q.len }}<\u002Fspan><\u002Fdiv>\n                            <\u002Fdiv>\n                          <\u002Fsc-if>\n                          <sc-if value=\"{{ q.showAnswer }}\">\n                            <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:12.5px;color:#6b7280\">پاسخ تشریحی شرکت:<\u002Fspan><div style=\"font-size:13.5px;line-height:1.95;color:#1f2937;background:#f7f8fa;border-radius:10px;padding:10px 12px;white-space:pre-wrap;text-wrap:pretty\">{{ q.ansText }}<\u002Fdiv><\u002Fdiv>\n                          <\u002Fsc-if>\n                          <sc-if value=\"{{ q.hasFiles }}\">\n                            <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n                              <sc-for list=\"{{ q.files }}\" as=\"fl\">\n                                <div style=\"display:flex;align-items:center;gap:8px;border:1px solid #e5e7eb;border-radius:8px;padding:6px 10px;background:#fafbfc;max-width:100%\">\n                                  <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#155e75\" stroke-width=\"1.8\" style=\"flex:none\"><path d=\"M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z\"><\u002Fpath><path d=\"M14 2v4a2 2 0 0 0 2 2h4\"><\u002Fpath><\u002Fsvg>\n                                  <div style=\"display:flex;flex-direction:column;min-width:0\"><span style=\"font-size:12.5px;color:#1f2937;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px\">{{ fl.name }}<\u002Fspan><span style=\"font-size:11px;color:#6b7280\">{{ fl.meta }}<\u002Fspan><\u002Fdiv>\n                                  <button sc-camel-on-click=\"{{ fl.onView }}\" aria-label=\"مشاهده\" title=\"مشاهده\" style=\"width:28px;height:28px;border:none;background:transparent;border-radius:6px;cursor:pointer;color:#155e75;display:flex;align-items:center;justify-content:center\" style-hover=\"background:#eaf7fa\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z\"></path><circle cx=\"12\" cy=\"12\" r=\"3\"></circle></svg></button><sc-if value=\"{{ fl.canDownload }}\"><button sc-camel-on-click=\"{{ fl.onDownload }}\" aria-label=\"دانلود\" title=\"دانلود\" style=\"width:28px;height:28px;border:none;background:transparent;border-radius:6px;cursor:pointer;color:#155e75;display:flex;align-items:center;justify-content:center\" style-hover=\"background:#eaf7fa\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n                                  </sc-if><sc-if value=\"{{ fl.canRemove }}\"><button sc-camel-on-click=\"{{ fl.onRemove }}\" aria-label=\"حذف فایل\" title=\"حذف\" style=\"width:28px;height:28px;border:none;background:transparent;border-radius:6px;cursor:pointer;color:#b91c1c;display:flex;align-items:center;justify-content:center\" style-hover=\"background:#fdecec\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M18 6 6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fsc-if>\n                                <\u002Fdiv>\n                              <\u002Fsc-for>\n                            <\u002Fdiv>\n                          <\u002Fsc-if>\n                          <sc-if value=\"{{ q.noFilesRead }}\"><div style=\"font-size:12.5px;color:#9ca3af\">پیوستی ارسال نشده است.<\u002Fdiv><\u002Fsc-if>\n                          <sc-if value=\"{{ q.edit }}\">\n                            <label sc-camel-on-drop=\"{{ q.onDrop }}\" sc-camel-on-drag-over=\"{{ q.onDragOver }}\" style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;border:1.5px dashed #c7d2da;border-radius:10px;padding:10px 14px;cursor:pointer;background:#fbfdfe\" style-hover=\"border-color:#155e75;background:#f2fafc\">\n                              <input type=\"file\" multiple=\"\" accept=\".pdf,.doc,.docx,.jpg,.jpeg,.mp4,.zip\" sc-camel-on-change=\"{{ q.onFile }}\" style=\"display:none\">\n                              <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#155e75\" stroke-width=\"2\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12\"><\u002Fpath><\u002Fsvg>\n                              <span style=\"font-size:13px;color:#155e75;font-weight:600\">افزودن پیوست (اختیاری)<\u002Fspan>\n                              <span style=\"font-size:12px;color:#6b7280\">یا فایل را این‌جا رها کنید · pdf، doc، docx، jpg، jpeg، mp4، zip — حداکثر ۵۰ مگابایت برای هر فایل<\u002Fspan>\n                            <\u002Flabel>\n                          <\u002Fsc-if>\n                          <sc-if value=\"{{ q.hasUpErr }}\"><div style=\"font-size:12.5px;color:#b91c1c;background:#fdecec;border-radius:8px;padding:6px 10px;align-self:flex-start\">{{ q.upErr }}<\u002Fdiv><\u002Fsc-if>\n                          <sc-if value=\"{{ q.showSuggest }}\"><div style=\"font-size:12.5px;color:#4b5563;line-height:1.9;background:#f7f8fa;border-radius:8px;padding:8px 12px\"><b style=\"font-weight:600;color:#374151\">پیوست پیشنهادی (اختیاری): <\u002Fb>{{ q.suggest }}<\u002Fdiv><\u002Fsc-if>\n                          \n                          <sc-if value=\"{{ q.review }}\">\n                            <div style=\"border-top:1px dashed #e5e7eb;padding-top:12px;display:flex;flex-direction:column;gap:10px\">\n                              <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center\">\n                                <span style=\"font-size:12.5px;color:#6b7280\">تصمیم ارزیاب:<\u002Fspan>\n                                <div role=\"radiogroup\" style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                                  <sc-for list=\"{{ q.decs }}\" as=\"o\"><button role=\"radio\" aria-checked=\"{{ o.sel }}\" sc-camel-on-click=\"{{ o.onClick }}\" style=\"height:36px;padding:0 14px;border-radius:10px;border:1px solid {{ o.bd }};background:{{ o.bg }};color:{{ o.fg }};font-size:13px;cursor:pointer\">{{ o.label }}<\u002Fbutton><\u002Fsc-for>\n                                <\u002Fdiv>\n                                <span style=\"font-size:13px;font-weight:700;color:#155e75;margin-right:auto\">{{ q.ptsLabel }}<\u002Fspan>\n                              <\u002Fdiv>\n                              <button sc-camel-on-click=\"{{ q.toggleRc }}\" style=\"align-self:flex-start;border:none;background:transparent;color:#155e75;font-size:12.5px;cursor:pointer;padding:0\">{{ q.rcToggleLabel }}<\u002Fbutton>\n                              <sc-if value=\"{{ q.rcOpen }}\"><textarea value=\"{{ q.rc }}\" sc-camel-on-change=\"{{ q.onRc }}\" sc-camel-max-length=\"2000\" rows=\"2\" placeholder=\"توضیح ارزیاب (اختیاری)\" style=\"border:1px solid #d1d5db;border-radius:10px;padding:10px 12px;font-size:13.5px;resize:vertical;outline-color:#155e75\"><\u002Ftextarea><\u002Fsc-if>\n                            <\u002Fdiv>\n                          <\u002Fsc-if>\n                          <sc-if value=\"{{ q.showFinal }}\">\n                            <div style=\"border-top:1px dashed #e5e7eb;padding-top:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px\">\n                              <span style=\"color:#6b7280\">تصمیم ارزیاب:<\u002Fspan><span style=\"border-radius:6px;padding:3px 10px;font-weight:600;background:#eaf7fa;color:#124d62\">{{ q.decLabel }}<\u002Fspan>\n                              <span style=\"font-weight:700;color:#155e75;margin-right:auto\">{{ q.ptsLabel }}<\u002Fspan>\n                              <sc-if value=\"{{ q.hasRc }}\"><div style=\"flex-basis:100%;color:#374151;line-height:1.9\"><span style=\"color:#6b7280\">توضیح ارزیاب: <\u002Fspan>{{ q.rc }}<\u002Fdiv><\u002Fsc-if>\n                            <\u002Fdiv>\n                          <\u002Fsc-if>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ qv.isEdit }}\">\n            <div style=\"position:sticky;bottom:12px;z-index:20;background:#124d62;color:#fff;border-radius:12px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(18,77,98,.25)\">\n              <span style=\"flex:1;min-width:200px;font-size:13.5px\">{{ qv.barText }}<\u002Fspan>\n              <sc-if value=\"{{ qv.hasIncomplete }}\"><button sc-camel-on-click=\"{{ qv.gotoIncomplete }}\" style=\"height:38px;padding:0 14px;border:1px solid rgba(255,255,255,.4);border-radius:10px;background:transparent;color:#fff;font-size:13px;cursor:pointer\">رفتن به اولین بند ناقص<\u002Fbutton><\u002Fsc-if>\n              <button sc-camel-on-click=\"{{ qv.openSubmit }}\" style=\"height:38px;padding:0 18px;border:none;border-radius:10px;background:#fff;color:#124d62;font-size:13.5px;font-weight:700;cursor:pointer\">ارسال برای ارزیابی<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n\n        <!-- RESULTS -->\n        <sc-if value=\"{{ sResults }}\">\n          <div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between\">\n            <div style=\"display:flex;flex-direction:column;gap:6px\">\n              <div style=\"font-size:12.5px;color:#6b7280\">{{ rv.company }}<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center\"><div style=\"font-size:clamp(20px,2.2vw,28px);font-weight:700\">نتایج ارزیابی آمادگی<\u002Fdiv><span style=\"font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 12px;background:{{ rv.badgeBg }};color:{{ rv.badgeFg }}\">{{ rv.badge }}<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n              <button sc-camel-on-click=\"{{ rv.toggleTables }}\" style=\"height:40px;padding:0 14px;border:1px solid #d1d5db;border-radius:10px;background:#fff;font-size:13px;cursor:pointer\">{{ rv.tablesLabel }}<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ rv.goQuestions }}\" style=\"height:40px;padding:0 14px;border:1px solid #1f2937;border-radius:10px;background:#fff;font-size:13px;font-weight:600;cursor:pointer\">{{ rv.questionsLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ rv.locked }}\">\n            <div style=\"background:#fff;border:1px dashe \"><path d=\"M18 6 6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"padding:18px 22px;display:flex;flex-direction:column;gap:14px;font-size:14px;line-height:1.9;color:#374151\">\n        <sc-if value=\"{{ m.hasText }}\"><div style=\"text-wrap:pretty\">{{ m.text }}<\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{ m.hasList }}\">\n          <div style=\"display:flex;flex-direction:column;border:1px solid #eef0f2;border-radius:10px;max-height:240px;overflow-y:auto\">\n            <sc-for list=\"{{ m.list }}\" as=\"li\"><button sc-camel-on-click=\"{{ li.onClick }}\" style=\"text-align:right;border:none;border-bottom:1px solid #f1f2f4;background:#fff;padding:8px 12px;font-size:13px;cursor:pointer;display:flex;gap:8px\" style-hover=\"background:#f7f8fa\"><span style=\"color:#155e75;flex:none\">{{ li.tag }}<\u002Fspan><span style=\"flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ li.text }}<\u002Fspan><\u002Fbutton><\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ m.hasStats }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px\">\n            <sc-for list=\"{{ m.stats }}\" as=\"s\"><div style=\"background:#f7f8fa;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:12px;color:#6b7280\">{{ s.label }}<\u002Fspan><span style=\"font-size:20px;font-weight:700;color:#155e75\">{{ s.value }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ m.hasProfile }}\">\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <span style=\"font-size:13px;color:#6b7280\">پروفایل تولید داده<\u002Fspan>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n              <sc-for list=\"{{ m.profiles }}\" as=\"o\"><button sc-camel-on-click=\"{{ o.onClick }}\" style=\"height:36px;padding:0 16px;border-radius:10px;border:1px solid {{ o.bd }};background:{{ o.bg }};color:{{ o.fg }};font-size:13px;cursor:pointer\">{{ o.label }}<\u002Fbutton><\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ m.hasFields }}\">\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <sc-for list=\"{{ m.fields }}\" as=\"fd\">\n              <div style=\"display:flex;flex-direction:column;gap:6px\">\n                <label style=\"font-size:13px;color:#374151\">{{ fd.label }}<\u002Flabel>\n                <sc-if value=\"{{ fd.isInput }}\"><input value=\"{{ fd.value }}\" sc-camel-on-change=\"{{ fd.onChange }}\" dir=\"{{ fd.dir }}\" style=\"height:42px;border:1px solid #d1d5db;border-radius:10px;padding:0 12px;font-size:14px;outline-color:#155e75\"><\u002Fsc-if>\n                <sc-if value=\"{{ fd.isSelect }}\"><sc-raw-select value=\"{{ fd.value }}\" sc-camel-on-change=\"{{ fd.onChange }}\" style=\"height:42px;border:1px solid #d1d5db;border-radius:10px;padding:0 10px;font-size:14px;background:#fff\"><sc-for list=\"{{ fd.opts }}\" as=\"o\"><option value=\"{{ o.v }}\">{{ o.l }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ m.hasErr }}\"><div style=\"font-size:13px;color:#b91c1c;background:#fdecec;border-radius:8px;padding:8px 12px\">{{ m.err }}<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"padding:14px 22px;border-top:1px solid #eef0f2;display:flex;gap:10px;justify-content:flex-start;flex-wrap:wrap\">\n        <button sc-camel-on-click=\"{{ m.onOk }}\" disabled=\"{{ m.okDisabled }}\" style=\"height:42px;padding:0 20px;border:none;border-radius:10px;background:{{ m.okBg }};color:#fff;font-size:14px;font-weight:600;cursor:pointer\">{{ m.okLabel }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ closeModal }}\" style=\"height:42px;padding:0 18px;border:1px solid #d1d5db;border-radius:10px;background:#fff;font-size:14px;cursor:pointer\">انصراف<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ hasToast }}\">\n  <div role=\"status\" style=\"position:fixed;bottom:24px;left:24px;z-index:100;background:{{ toastBg }};color:#fff;border-radius:10px;padding:12px 18px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-width:calc(100vw - 48px)\">{{ toastText }}<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { ready: false, err: '', db: null, userId: null, screen: 'login', aid: null, indId: 'IND-01', qFilter: 'all', qSearch: '',\n    closedSubs: {}, openCmt: {}, openRc: {}, save: 'idle', toast: null, modal: null, profile: 'medium', resInd: null, resSort: 'order',\n    showTables: false, allLost: false, allCrit: false, stFilter: 'active', coSearch: '', cmpInd: 'ALL', narrow: false, drawer: false,\n    lu: '', lp: '', lerr: false, upErr: {}, form: {}, formErr: '' };\n\n  FA = new Intl.NumberFormat('fa-IR');\n  FA1 = new Intl.NumberFormat('fa-IR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });\n  DF = new Intl.DateTimeFormat('fa-IR-u-ca-persian', { year: 'numeric', month: '2-digit', day: '2-digit', timeZone: 'Asia/Tehran' });\n  TF = new Intl.DateTimeFormat('fa-IR', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Tehran' });\n  n = x => this.FA.format(x);\n  p = x => this.FA1.format(x) + '٪';\n  d = iso => iso ? this.DF.format(new Date(iso)) : '—';\n  compCache = new WeakMap(); resCache = new WeakMap(); blobs = {};\n\n  ST = {\n    DRAFT: { ee: 'در حال تکمیل', or: 'در حال تکمیل', bg: '#f1f5f9', fg: '#475569' },\n    SUBMITTED: { ee: 'ارسال‌شده؛ منتظر بررسی', or: 'منتظر بررسی', bg: '#fdf3e1', fg: '#8a5a0f' },\n    IN_REVIEW: { ee: 'در حال ارزیابی', or: 'در حال ارزیابی', bg: '#e3f3f6', fg: '#155e75' },\n    READY_TO_FINALIZE: { ee: 'در حال ارزیابی', or: 'آماده نهایی‌سازی', bg: '#e6f6ea', fg: '#15803d' },\n    FINALIZED: { ee: 'نهایی‌شده', or: 'نهایی‌شده', bg: '#166534', fg: '#ffffff' }\n  };\n  ANS = [['YES', 'بله'], ['PARTIAL', 'تا حدودی'], ['NO', 'خیر']];\n  ANS_L = { YES: 'بله', PARTIAL: 'تا حدودی', NO: 'خیر' };\n  DEC = [['YES', 'بله (۳)'], ['CORRECTIVE', 'نیازمند اقدام اصلاحی (۱)'], ['NO', 'خیر (۰)']];\n  DEC_L = { YES: 'بله (۳)', CORRECTIVE: 'نیازمند اقدام اصلاحی (۱)', NO: 'خیر (۰)' };\n  DEC_S = { YES: 'بله', CORRECTIVE: 'اقدام اصلاحی', NO: 'خیر' };\n  PROFILES = { strong: 0.9, medium: 0.7, weak: 0.45 };\n  ROLE_L = { ADMIN: 'مدیر سامانه', ASSESSOR: 'ارزیاب', ASSESSEE: 'ارزیابی‌شونده' };\n\n  async componentDidMount() {\n    this.onResize = () => { const nw = window.innerWidth < 900; if (nw !== this.state.narrow) this.setState({ narrow: nw, drawer: false }); };\n    this.setState({ narrow: window.innerWidth < 900 });\n    window.addEventListener('resize', this.onResize);\n    try {\n      const [bank, mod] = await Promise.all([\n        fetch((window.__resources && window.__resources.bank) || new URL('data/question-bank.json', document.baseURI).href).then(r => r.json()),\n        import((window.__resources && window.__resources.scoring) || new URL('lib/scoring.js', document.baseURI).href)\n      ]);\n      this.bank = bank; this.sc = mod;\n      this.qById = {}; this.indById = {}; this.subById = {}; this.indIdx = {}; this.qByInd = {};\n      bank.indicators.forEach((x, i) => { this.indById[x.id] = x; this.indIdx[x.id] = i; this.qByInd[x.id] = []; });\n      bank.sub_indicators.forEach(x => this.subById[x.id] = x);\n      bank.questions.forEach(q => { this.qById[q.id] = q; this.qByInd[q.indicator_id].push(q); });\n      this.lastDb = { companies: [], users: [], assessments: [] }; this.setState({ ready: true, db: this.lastDb });\n      try { const m = await fetch('/api/me'); if (m.ok) await this.enter((await m.json()).username); } catch (e) {}\n    } catch (e) { this.setState({ err: 'خطا در بارگ
